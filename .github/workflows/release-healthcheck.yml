name: Release Healthcheck

# Pre-publish sanity check for `packages/browser` (`posthog-js`). Runs
# `npm publish --dry-run` on a tempdir copy of the package manifest so the
# packed file list and advertised version are visible on the PR page.
#
# No registry writes. No publish token read. Garnet runs first in monitor
# mode so the runtime behavior of the dry-run job is recorded against
# `.garnet/network-policy.yaml`.

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/release-healthcheck.yml'
            - 'tooling/release-healthcheck/**'
            - '.garnet/**'
            - 'packages/browser/package.json'
    push:
        branches:
            - main
        paths:
            - '.github/workflows/release-healthcheck.yml'
            - 'tooling/release-healthcheck/**'

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: release-healthcheck-${{ github.ref }}
    cancel-in-progress: true

jobs:
    dry-run:
        name: Release dry-run
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        steps:
            # actions/checkout@v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            # Garnet runs first so every execve / egress / write in the rest
            # of the job is recorded against .garnet/network-policy.yaml.
            # Monitor-only here (mode: alert) — the action does not gate the
            # PR; runtime observations surface as alerts.
            # garnet-org/action@v2
            - name: Garnet
              uses: garnet-org/action@9e819143e63d6dda04bca2e90ac85e3cf0e5289d
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}

            # actions/setup-node@v4.4.0
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22

            # Copies packages/browser/package.json into a temp dir and runs
            # `npm publish --dry-run` so the packed file list is printed and
            # nothing hits the registry.
            - name: Verify publish dry-run
              working-directory: tooling/release-healthcheck
              run: node verify.js
