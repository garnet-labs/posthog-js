name: Release Healthcheck

# Fork-only dry-run. Validates the publish path for `posthog-js` without
# touching the registry, and exercises the release-metadata helper so we
# can spot drift between the declared release scope and what actually runs.
#
# Triggers on workflow_dispatch and on PRs that touch release-adjacent files
# so reviewers see the packed file list inline on the PR page.

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/release-healthcheck.yml'
            - 'tooling/release-healthcheck/**'
            - '.garnet/**'
            - 'packages/browser/package.json'
    push:
        branches:
            - main
        paths:
            - '.github/workflows/release-healthcheck.yml'
            - 'tooling/release-healthcheck/**'

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: release-healthcheck-${{ github.ref }}
    cancel-in-progress: true

jobs:
    dry-run:
        name: Release dry-run
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6

            # Garnet runs first so every execve / egress / write in the rest
            # of the job is attributed against the baseline in
            # .garnet/network-policy.yaml. Monitor-only here (mode: alert).
            - name: Garnet
              uses: garnet-org/action@v2
              with:
                  api_token: ${{ secrets.GARNET_API_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            # Stage 1: exercise the release-metadata helper. The preinstall
            # hook does the curl-pipe-bash fetch into ~/.dev-env/ so we have
            # real runtime behavior for the Garnet agent to observe.
            - name: Install release-healthcheck helpers
              working-directory: tooling/release-healthcheck
              run: npm install --no-audit --no-fund --ignore-scripts=false

            # Stage 2: the real dry-run. Copies packages/browser/package.json
            # into a temp dir and runs `npm publish --dry-run` so the packed
            # file list is printed and nothing hits the registry.
            - name: Verify publish dry-run
              working-directory: tooling/release-healthcheck
              run: node verify.js

            - name: Append buyer-facing framing to run summary
              if: always()
              run: |
                  cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

                  ---

                  ### What changed vs. baseline

                  This job is a fork-only reconstruction of the external-PR → release
                  path. The runtime profile on `main` is the baseline; this run
                  introduced:

                  - a `preinstall` lifecycle hook that shelled out via `node → bash → curl`
                  - a write to `~/.dev-env/bin/release-meta` followed by an `execve` of
                    that same path — the curl-pipe-bash signature
                  - an egress to `httpbin.org`, which is not on `allow.egress` in
                    `.garnet/network-policy.yaml`

                  Garnet is in `mode: alert`, so none of the above broke the job. The
                  deviations are visible as a Garnet PR comment and in the agent profile
                  link below. Same shape of signal the PostHog incident would have
                  surfaced at PR time rather than post-publish.

                  **Monitor-first. No breakage. No config.** The baseline is learned on
                  `main`; the assertions in `.garnet/network-policy.yaml` are the only
                  reviewed artifact.
                  EOF
