name: Garnet PostHog-JS Release Monitor

# Profiles the posthog-js SDK on each upstream release.
# Runs daily at 10:22 UTC and on manual dispatch.
#
# Two jobs — sdk-install and sdk-build — each get their own Garnet profile
# via GARNET_PROFILE_JOB / GARNET_PROFILE_WORKFLOW env vars set BEFORE
# garnet-org/action so the Garnet UI shows distinct rows.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upstream tag to profile (blank = latest v1.x.x)"
        required: false
        default: ""
  schedule:
    - cron: '22 10 * * *'   # 10:22 UTC daily

permissions:
  contents: read
  actions: read

jobs:
  # ── 1. Detect the latest upstream release tag ──────────────────────────
  prepare:
    name: Detect latest release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag:      ${{ steps.detect.outputs.tag }}
      safe_tag: ${{ steps.detect.outputs.safe_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/PostHog/posthog-js.git 2>/dev/null || true
          git fetch upstream --tags --force

      - name: Detect latest release tag
        id: detect
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # posthog-js uses v1.x.x semver tags
            TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # safe_tag: printf (not echo) to avoid phantom trailing underscore
          SAFE_TAG=$(printf '%s' "$TAG" \
            | tr -c 'A-Za-z0-9._-' '_' \
            | sed -E 's/^_+|_+$//g' \
            | cut -c1-80)
          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest release: $TAG (safe: $SAFE_TAG)"

  # ── 2. Profile SDK install ─────────────────────────────────────────────
  sdk-install:
    name: "Profile SDK install (${{ needs.prepare.outputs.tag }})"
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set per-job Garnet profile identity
        shell: bash
        run: |
          echo "GARNET_PROFILE_JOB=posthog-js-install-${{ needs.prepare.outputs.safe_tag }}" >> "$GITHUB_ENV"
          echo "GARNET_PROFILE_WORKFLOW=garnet-posthog-js-monitor/install@${{ needs.prepare.outputs.safe_tag }}" >> "$GITHUB_ENV"

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@2b7fc9d79b54f551b43358c27424a36064b3e078 # v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.12.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "── pnpm install ──"
          pnpm install --no-frozen-lockfile || true
          echo "── installed packages ──"
          pnpm list --depth=0 2>/dev/null | wc -l
          exit 0

  # ── 3. Profile SDK build ───────────────────────────────────────────────
  sdk-build:
    name: "Profile SDK build (${{ needs.prepare.outputs.tag }})"
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set per-job Garnet profile identity
        shell: bash
        run: |
          echo "GARNET_PROFILE_JOB=posthog-js-build-${{ needs.prepare.outputs.safe_tag }}" >> "$GITHUB_ENV"
          echo "GARNET_PROFILE_WORKFLOW=garnet-posthog-js-monitor/build@${{ needs.prepare.outputs.safe_tag }}" >> "$GITHUB_ENV"

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@2b7fc9d79b54f551b43358c27424a36064b3e078 # v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.12.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm install --no-frozen-lockfile || true
          echo "── pnpm build ──"
          pnpm build || true
          echo "── pnpm test:unit (exercises runtime) ──"
          pnpm test:unit 2>/dev/null || true
          exit 0
