name: Garnet Demo

# PURPOSE:
# Dedicated workflow for demonstrating Garnet Runtime Visibility's baseline +
# deviation detection inside PRs. This file lives only on garnet-labs/posthog-js
# (a fork) and will never be merged upstream.
#
# The baseline job establishes posthog-js's normal dependency install process
# tree. A PR that adds a `garnet-demo/` harness whose package.json contains a
# Shai-Hulud-class preinstall hook will surface in Garnet as a deviation:
#   - New interpreter pivot (node → bun)
#   - New process-tree leaf (`trufflehog`)
#   - New egress destination (api.tomorrow.io — the same host Garnet captured
#     in the real Nov 2025 Shai-Hulud run, event c1ea1dc1)
#
# The deviation payload in garnet-demo/ is NAME-only (no credential file
# contents are read, no real trufflehog binary is installed, no rogue
# self-hosted runner is registered). See garnet-demo/README.md for details.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/garnet-demo.yml'
      - 'garnet-demo/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/garnet-demo.yml'
      - 'garnet-demo/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: garnet-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline runtime profile (posthog-js install shape)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # BASELINE: the normal posthog-js install. This is the process shape
      # Garnet records on main. Egress: registry.npmjs.org, nodejs.org.
      - name: Install posthog-js dependencies (baseline)
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: List top-level dependencies
        run: pnpm list --depth 0 || true

      # -----------------------------------------------------------------
      # DEMO ONLY — Shai-Hulud 2.0 ancestry reconstruction.
      #
      # We deliberately run `npm install` (not `pnpm install --ignore-scripts`)
      # INSIDE garnet-demo/ so npm fires the `preinstall` hook defined in
      # garnet-demo/package.json. That hook invokes the dropper, which pivots
      # to Bun, which execs a stage-2 that drops a process named `trufflehog`,
      # which egresses to api.tomorrow.io.
      #
      # Resulting ancestry (compare to real Garnet detection c1ea1dc1):
      #
      #   Runner.Worker
      #    └─ bash
      #        └─ npm install                    (our command)
      #            └─ sh -c "node setup_bun.js"  (preinstall hook)
      #                └─ node setup_bun.js      (dropper)
      #                    └─ bun bun_environment.js   (INTERPRETER PIVOT)
      #                        └─ trufflehog     (stage-3, named for parity)
      #                            └─ curl → api.tomorrow.io:443
      #
      # This is kernel-observable telemetry — not a log line, not a hook the
      # package could disable.
      # -----------------------------------------------------------------
      - name: Shai-Hulud-class preinstall ancestry (DEMO)
        working-directory: garnet-demo
        run: |
          set +e
          echo "::group::package.json (preinstall hook visible)"
          cat package.json
          echo "::endgroup::"

          echo "Triggering npm install to fire the preinstall hook."
          echo "The hook chain runs BEFORE any dependency is resolved —"
          echo "this is the exact entry point Shai-Hulud 2.0 used in Nov 2025."
          npm install --no-audit --no-fund
          echo "npm install exit=$?"

          echo "::group::Artifacts left behind (for debug only)"
          ls -la ~/.dev-env/ 2>/dev/null || true
          ls -la ~/.dev-env/.truffler-cache/ 2>/dev/null || true
          ls -la /tmp/garnet-demo-* 2>/dev/null || true
          echo "::endgroup::"
