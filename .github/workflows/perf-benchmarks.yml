name: Perf Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/perf-benchmarks.yml'
      - 'packages/browser/**'
      - 'tooling/perf/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/perf-benchmarks.yml'
      - 'packages/browser/**'
      - 'tooling/perf/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Run browser micro-benchmarks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Garnet runs in monitor mode (alert-only) and records the runtime
      # behavior of the rest of the job (execve / egress / writes) against
      # `.garnet/network-policy.yaml`. It does not gate the PR.
      # garnet-org/action@v2
      - name: Garnet
        uses: garnet-org/action@9e819143e63d6dda04bca2e90ac85e3cf0e5289d
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      # actions/setup-node@v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run benchmarks
        working-directory: tooling/perf
        run: node run.js

      # actions/upload-artifact@v4.6.2
      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-results
          path: tooling/perf/results.json
          if-no-files-found: error
