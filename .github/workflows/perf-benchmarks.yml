name: Perf Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/perf-benchmarks.yml'
      - 'packages/browser/**'
      - 'tooling/perf/**'
      - '.garnet/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/perf-benchmarks.yml'
      - 'packages/browser/**'
      - 'tooling/perf/**'
      - '.garnet/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Run browser micro-benchmarks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Garnet: reads .garnet/network-policy.yaml from the checkout if present,
      # otherwise falls back to the merged policy from the Garnet API.
      - name: Garnet
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run benchmarks
        working-directory: tooling/perf
        run: node run.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: tooling/perf/results.json
          if-no-files-found: error
