# Garnet network policy for garnet-labs/posthog-js
#
# Same shape as the merged policy the Garnet action fetches at the start of
# every run. Checking it into the repo gives us:
#   (1) an auditable diff when the allow list changes
#   (2) a default-allow, alert-on-deviation posture without handwritten rules
#
# The allow list is a hand-maintained set of destinations CI is expected to
# reach. Runtime evidence from monitor-mode runs is surfaced as alerts
# against this file; updates to the list are made by an explicit, reviewed
# PR — no automated baselining or historical diff is performed.

version: 1
mode: alert                # alert | enforce | both   (start with alert)
policy: allow              # default action for unmatched destinations
resolve_mode: permissive

scopes:
  - scope: repo
    repository: garnet-labs/posthog-js
  # Release-adjacent workflows (publish, tag, changesets) inherit the base
  # scope but surface as their own profile so a publish-time deviation is
  # obviously scoped to "the release path" rather than a perf job.
  - scope: workflow
    workflow: Release Healthcheck

# Allow list — hand-maintained. Touching this file requires a code review,
# which is what makes "what the CI can talk to" a versioned, reviewed
# artifact rather than a dashboard setting.
allow:
  # Package registries
  - registry.npmjs.org
  - objects.githubusercontent.com
  - release-assets.githubusercontent.com
  # GitHub Actions infrastructure
  - github.com
  - api.github.com
  - "*.githubapp.com"
  - "*.actions.githubusercontent.com"
  - "*.blob.core.windows.net"
  - "*.trafficmanager.net"
  # Node / pnpm
  - nodejs.org
  - "*.pnpm.io"

# Per-workflow overrides live here when a specific workflow needs something
# the rest of the repo shouldn't. Empty for now.
workflows: {}

assertions:
  # Shipped today — matches destinations against Garnet's managed threat feed.
  - id: no_bad_egress_domain
    type: known_bad_egress
    severity: high

  # Uses the same rule engine as known_bad_egress, but the "bad" list is
  # "anything not in `allow:` above". In monitor mode this surfaces an
  # alert when a run reaches a destination that is not on the allow list;
  # it does not fail the job.
  - id: no_unbaselined_egress
    type: known_bad_egress     # same underlying check, different source list
    source: policy.allow       # "alert if destination is NOT in policy.allow"
    severity: high
    # Fine-grained suppressions for intentional, temporary additions. A PR
    # that adds a destination to `allow:` doesn't need a suppression — the
    # allow change itself is the review signal.
    suppress: []
