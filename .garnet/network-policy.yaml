# Garnet network policy for garnet-labs/posthog-js
#
# Same shape as the merged policy the Garnet action already fetches at the
# start of every run. Checking it into the repo gives us:
#   (1) an auditable diff when the allowlist changes
#   (2) a default-allow, alert-on-deviation posture without handwritten rules
#
# The allow list is seeded from the last N successful runs of each workflow on
# `main`. Garnet's baseline learner runs nightly and opens a PR against this
# file when new destinations stabilize. A human reviews and merges.
# Deviation alerts fire against whatever is merged here.

version: 1
mode: alert                # alert | enforce | both   (start with alert)
policy: allow              # default action for unmatched destinations
resolve_mode: permissive

scopes:
  - scope: repo
    repository: garnet-labs/posthog-js

# Allow list — learned from main baseline runs. Touching this file requires
# a code review, which is what makes "what the CI can talk to" a versioned,
# reviewed artifact rather than a dashboard setting.
allow:
  # Package registries
  - registry.npmjs.org
  - objects.githubusercontent.com
  - release-assets.githubusercontent.com
  # GitHub Actions infrastructure
  - github.com
  - api.github.com
  - "*.githubapp.com"
  - "*.actions.githubusercontent.com"
  - "*.blob.core.windows.net"
  - "*.trafficmanager.net"
  # Node / pnpm
  - nodejs.org
  - "*.pnpm.io"

# Per-workflow overrides live here when a specific workflow needs something
# the rest of the repo shouldn't. Empty for now.
workflows: {}

assertions:
  # Shipped today — matches destinations against Garnet's managed threat feed.
  - id: no_bad_egress_domain
    type: known_bad_egress
    severity: high

  # Uses the same rule engine as known_bad_egress, but the "bad" list is
  # "anything not in `allow:` above". Fails when a PR introduces an egress
  # destination that the baseline on main has never reached.
  - id: no_unbaselined_egress
    type: known_bad_egress     # same underlying check, different source list
    source: policy.allow       # "fail if destination is NOT in policy.allow"
    severity: high
    # Fine-grained suppressions for intentional, temporary additions. A PR
    # that adds a destination to `allow:` doesn't need a suppression — the
    # allow change itself is the review signal.
    suppress: []
